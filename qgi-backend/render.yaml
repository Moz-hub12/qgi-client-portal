services:
  - type: web
    name: qgi-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "src.main:create_app()" \ #--bind 0.0.0.0:10000 --workers 3 --threads 2 --timeout 60
    envVars:
      - key: FRONTEND_URL
        value: https://www.quantumgrowthinvestments.com
      - key: ADMIN_URL
        value: https://quantum-growth-admin.onrender.com
      - key: PYTHON_VERSION
      value: 3.11.0
      - key: JWT_SECRET_KEY
      generateValue: true
      - key: DATABASE_URL
      fromDatabase:
        name: qgi-database
        property: connectionString
    autoDeploy: true
databases:
  - name: qgi-database
    databaseName: qgi_portal
    user: qgi_user
